services:
  # RestockIQ API 
  restockiq:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: restockiq
    restart: unless-stopped
    ports:
      - "${RESTOCKIQ_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://restockiq:${POSTGRES_PASSWORD:-restockiq}@postgres:5432/restockiq
      WERET_BASE_URL: ${WERET_BASE_URL:-http://weret-api:3000}
      WERET_API_KEY: ${WERET_API_KEY:-}
      WERET_WEBHOOK_SECRET: ${WERET_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      SAA_N_SCENARIOS: ${SAA_N_SCENARIOS:-200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - restockiq-internal
      - weret-network

  # Postgres 16
  postgres:
    image: postgres:16-alpine
    container_name: restockiq-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: restockiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restockiq}
      POSTGRES_DB: restockiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username restockiq --dbname restockiq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - restockiq-internal

# Volumes 
volumes:
  postgres-data:
    driver: local

# Networks 
networks:
  restockiq-internal:
    driver: bridge

  weret-network:
    name: weret_default
    driver: bridge
