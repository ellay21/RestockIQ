name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code Quality
  quality:
    name: Code Quality (lint · typecheck · import-linter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type-check with mypy
        run: mypy src/

      # dependency rule — violations are errors, block CI.
      - name: Enforce import boundaries (import-linter)
        run: lint-imports

  # Unit Tests
  unit-tests:
    name: Unit Tests (In-Memory)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest \
            -m "not integration" \
            --cov=src/restockiq \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Integration Tests
  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restockiq
          POSTGRES_PASSWORD: restockiq_test
          POSTGRES_DB: restockiq_test
        options: >-
          --health-cmd "pg_isready -U restockiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations against test DB
        env:
          DATABASE_URL: postgresql+asyncpg://restockiq:restockiq_test@localhost:5432/restockiq_test
        run: alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://restockiq:restockiq_test@localhost:5432/restockiq_test
          APP_ENV: testing
        run: pytest -m integration --tb=short -v
